name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Setup MSVC (C++ build tools for native modules)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies & Build
        shell: cmd
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npm run dist
          echo === release directory contents ===
          dir release\ 2>&1 || echo "release/ directory NOT FOUND or EMPTY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lottery-picker-release
          path: release/*
          retention-days: 30

      - name: Remove old rolling "latest" release (only on master)
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push --delete origin latest || true

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ github.ref == 'refs/heads/master' }}
          tag_name: ${{ github.ref == 'refs/heads/master' && 'latest' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/master' && format('Continuous Build {0}', github.sha) || github.ref_name }}

      # 可选：在 Gitee 同步一个“指向 GitHub”的发行版，方便 Gitee 访客一键跳转下载。
      # 需要先在 GitHub 仓库 Settings → Secrets 添加 GITEE_TOKEN（Gitee 私人令牌，勾选 projects 权限）。
      - name: Mirror release link to Gitee
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          GH_RELEASE="https://github.com/mr-awei/Lottery-Picker/releases/tag/${TAG}"
          BODY="本版本 Windows 安装包已由 GitHub Actions 自动构建，请前往 GitHub 下载：%0A${GH_RELEASE}"
          curl -sS -X POST \
            "https://gitee.com/api/v5/repos/mr-awei/lottery-picker/releases?access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"${BODY}\",\"prerelease\":false}" \
            || echo "Gitee 发行版已存在或创建失败，跳过（不影响 GitHub 构建）"
